<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:include="include :: header('商品首页')" />
  <style>
    .product-home-page {
      padding: 20px 0;
    }
    .page-header {
      text-align: center;
      margin-bottom: 40px;
      padding: 30px 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .page-header h1 {
      font-size: 36px;
      font-weight: bold;
      margin: 0 0 10px 0;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }
    .page-header .subtitle {
      font-size: 18px;
      opacity: 0.95;
      margin: 0;
    }
    .product-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-top: 20px;
    }
    .product-card {
      flex: 0 0 calc(50% - 10px);
      border: 1px solid #e7eaec;
      border-radius: 8px;
      padding: 20px;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      transition: all 0.3s ease;
      min-height: 300px;
    }
    .product-card:hover {
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
      transform: translateY(-2px);
    }
    .product-card-header {
      border-bottom: 2px solid #f0f0f0;
      padding-bottom: 15px;
      margin-bottom: 15px;
    }
    .product-card-header h3 {
      margin: 0 0 10px 0;
      font-size: 20px;
      font-weight: 600;
      color: #333;
    }
    .product-info {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .info-row {
      display: flex;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #f5f5f5;
    }
    .info-row:last-child {
      border-bottom: none;
    }
    .info-label {
      font-weight: 600;
      color: #666;
      min-width: 100px;
      font-size: 14px;
    }
    .info-value {
      color: #333;
      flex: 1;
      font-size: 14px;
      word-break: break-word;
    }
    .info-value.price {
      color: #e74c3c;
      font-size: 18px;
      font-weight: bold;
    }
    .info-value.stock {
      color: #27ae60;
      font-weight: 600;
    }
    .info-value.status {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }
    .info-value.status.on-shelf {
      background: #d4edda;
      color: #155724;
    }
    .info-value.status.off-shelf {
      background: #f8d7da;
      color: #721c24;
    }
    .product-description {
      margin-top: 15px;
      padding: 15px;
      background: #f8f9fa;
      border-radius: 4px;
      border-left: 4px solid #667eea;
    }
    .product-description .description-text {
      color: #555;
      line-height: 1.6;
      margin: 0;
    }
    .product-empty {
      width: 100%;
      padding: 60px 20px;
      text-align: center;
      color: #999;
      border: 2px dashed #d9d9d9;
      border-radius: 8px;
      background: #fafafa;
      font-size: 16px;
    }
    .loading {
      width: 100%;
      padding: 40px 20px;
      text-align: center;
      color: #666;
      font-size: 16px;
    }
    @media (max-width: 768px) {
      .product-card {
        flex: 0 0 100%;
      }
      .page-header h1 {
        font-size: 28px;
      }
      .page-header .subtitle {
        font-size: 16px;
      }
    }
  </style>
</head>
<body class="gray-bg">
<div class="wrapper wrapper-content animated fadeInRight product-home-page">
  <div class="page-header">
    <h1>农产品商城</h1>
    <p class="subtitle">浏览所有农户上架的商品，发现优质农产品</p>
  </div>
  
  <div class="ibox">
    <div class="ibox-content">
      <div id="productGrid" class="product-grid">
        <div class="loading">正在加载商品信息...</div>
      </div>
    </div>
  </div>
</div>

<th:block th:include="include :: footer" />
<script th:inline="javascript">
  var ctx = [[@{/}]];
  var tradeApiPrefix = ctx + "buyer/api/trade";

  function escapeHtml(text) {
    if (text === undefined || text === null) {
      return '';
    }
    return $('<div/>').text(text).html();
  }

  function formatPrice(value) {
    if (value === undefined || value === null) {
      return '0.00';
    }
    return parseFloat(value).toFixed(2);
  }

  function formatDate(dateStr) {
    if (!dateStr) return '-';
    try {
      var date = new Date(dateStr);
      return date.getFullYear() + '-' + 
             String(date.getMonth() + 1).padStart(2, '0') + '-' + 
             String(date.getDate()).padStart(2, '0') + ' ' +
             String(date.getHours()).padStart(2, '0') + ':' + 
             String(date.getMinutes()).padStart(2, '0') + ':' + 
             String(date.getSeconds()).padStart(2, '0');
    } catch (e) {
      return dateStr;
    }
  }

  function formatStatus(status) {
    if (status === 'on_shelf') {
      return '<span class="status on-shelf">上架中</span>';
    } else if (status === 'off_shelf') {
      return '<span class="status off-shelf">已下架</span>';
    }
    return escapeHtml(status || '-');
  }

  function renderProductCard(product) {
    var card = $('<div class="product-card"></div>');
    
    // 卡片头部
    var header = $('<div class="product-card-header"></div>');
    header.append('<h3>' + escapeHtml(product.name || '未命名商品') + '</h3>');
    card.append(header);
    
    // 商品信息
    var infoContainer = $('<div class="product-info"></div>');
    
    // 农户ID
    var farmerIdRow = $('<div class="info-row"></div>');
    farmerIdRow.append('<span class="info-label">农户ID：</span>');
    farmerIdRow.append('<span class="info-value">' + escapeHtml(product.farmerId || '-') + '</span>');
    infoContainer.append(farmerIdRow);
    
    // 商品ID
    var productIdRow = $('<div class="info-row"></div>');
    productIdRow.append('<span class="info-label">商品ID：</span>');
    productIdRow.append('<span class="info-value">' + escapeHtml(product.id || '-') + '</span>');
    infoContainer.append(productIdRow);
    
    // 商品价格
    var priceRow = $('<div class="info-row"></div>');
    priceRow.append('<span class="info-label">商品价格：</span>');
    priceRow.append('<span class="info-value price">¥' + formatPrice(product.price) + '</span>');
    infoContainer.append(priceRow);
    
    // 库存数量
    var stockRow = $('<div class="info-row"></div>');
    stockRow.append('<span class="info-label">库存数量：</span>');
    stockRow.append('<span class="info-value stock">' + escapeHtml(product.stock != null ? product.stock : '-') + '</span>');
    infoContainer.append(stockRow);
    
    // 商品状态
    var statusRow = $('<div class="info-row"></div>');
    statusRow.append('<span class="info-label">商品状态：</span>');
    statusRow.append('<span class="info-value">' + formatStatus(product.status) + '</span>');
    infoContainer.append(statusRow);
    
    // 创建时间
    var createdAtRow = $('<div class="info-row"></div>');
    createdAtRow.append('<span class="info-label">创建时间：</span>');
    createdAtRow.append('<span class="info-value">' + formatDate(product.createdAt) + '</span>');
    infoContainer.append(createdAtRow);
    
    // 更新时间
    var updatedAtRow = $('<div class="info-row"></div>');
    updatedAtRow.append('<span class="info-label">更新时间：</span>');
    updatedAtRow.append('<span class="info-value">' + formatDate(product.updatedAt) + '</span>');
    infoContainer.append(updatedAtRow);
    
    card.append(infoContainer);
    
    // 商品描述
    if (product.description) {
      var descDiv = $('<div class="product-description"></div>');
      descDiv.append('<p class="description-text"><strong>商品描述：</strong>' + escapeHtml(product.description) + '</p>');
      card.append(descDiv);
    }
    
    return card;
  }

  function renderProducts(products) {
    var $grid = $('#productGrid');
    $grid.empty();
    
    if (!products || products.length === 0) {
      $grid.append('<div class="product-empty">暂无可购买的商品，请稍后再来查看。</div>');
      return;
    }
    
    products.forEach(function(product) {
      var card = renderProductCard(product);
      $grid.append(card);
    });
  }

  function loadProducts() {
    $('#productGrid').html('<div class="loading">正在加载商品信息...</div>');
    
    $.get(tradeApiPrefix + "/products", function(res) {
      if (res.code === 0) {
        renderProducts(res.data || []);
      } else {
        $('#productGrid').html('<div class="product-empty">加载失败：' + escapeHtml(res.msg || '未知错误') + '</div>');
      }
    }).fail(function() {
      $('#productGrid').html('<div class="product-empty">加载失败，请稍后重试。</div>');
    });
  }

  $(function() {
    loadProducts();
  });
</script>
</body>
</html>
