<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>发布主题</title>
  <th:block th:include="include :: header('发布主题')" />
  <th:block th:include="include :: layout-latest-css" />
  <style>
    .forum-add-container {
      padding: 20px;
    }
    .form-group label {
      font-weight: bold;
      margin-bottom: 8px;
    }
    .btn-back {
      margin-bottom: 20px;
    }
  </style>
</head>
<body class="gray-bg">
<div class="wrapper wrapper-content animated fadeInRight">
  <div class="ibox">
    <div class="ibox-title">
      <h5><i class="fa fa-edit"></i> 发布主题</h5>
    </div>
    <div class="ibox-content forum-add-container">
      <button type="button" class="btn btn-default btn-back" onclick="location.href='/farmer/forum/index'">
        <i class="fa fa-arrow-left"></i> 返回列表
      </button>

      <form id="topicForm" class="form-horizontal">
        <div class="form-group">
          <label class="col-sm-2 control-label">主题标题 <span style="color: red;">*</span></label>
          <div class="col-sm-10">
            <input type="text" name="title" class="form-control" placeholder="请输入主题标题" maxlength="100" required>
          </div>
        </div>

        <div class="form-group">
          <label class="col-sm-2 control-label">分类</label>
          <div class="col-sm-10">
            <select name="categoryId" class="form-control">
              <option value="">请选择分类</option>
              <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="col-sm-2 control-label">主题内容 <span style="color: red;">*</span></label>
          <div class="col-sm-10">
            <textarea name="content" class="form-control" rows="15" placeholder="请输入主题内容..." required></textarea>
          </div>
        </div>

        <div class="form-group">
          <div class="col-sm-offset-2 col-sm-10">
            <button type="submit" class="btn btn-primary">
              <i class="fa fa-check"></i> 发布
            </button>
            <button type="button" class="btn btn-default" onclick="location.href='/farmer/forum/index'">
              <i class="fa fa-times"></i> 取消
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>

<th:block th:include="include :: layout-latest-js" />
<script>
$(function() {
  $('#topicForm').submit(function(e) {
    e.preventDefault();
    
    var title = $('input[name="title"]').val().trim();
    var content = $('textarea[name="content"]').val().trim();
    
    if (!title) {
      layer.msg('请输入主题标题', {icon: 2});
      return;
    }
    if (!content) {
      layer.msg('请输入主题内容', {icon: 2});
      return;
    }
    
    var formData = $(this).serialize();
    $.ajax({
      url: '/farmer/forum/save',
      type: 'POST',
      data: formData,
      success: function(result) {
        if (result.code == 0) {
          layer.msg('发布成功', {icon: 1}, function() {
            location.href = '/farmer/forum/index';
          });
        } else {
          layer.msg(result.msg || '发布失败', {icon: 2});
        }
      },
      error: function() {
        layer.msg('网络错误', {icon: 2});
      }
    });
  });
});
</script>
</body>
</html>
