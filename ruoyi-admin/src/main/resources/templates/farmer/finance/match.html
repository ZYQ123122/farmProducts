<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能匹配</title>
  <th:block th:include="include :: header('智能匹配')" />
  <style>
    .product-list-container {
      padding: 20px;
    }
    .product-card {
      background: #fff;
      border: 1px solid #e7eaec;
      border-radius: 4px;
      padding: 20px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      transition: box-shadow 0.3s;
    }
    .product-card:hover {
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .product-info {
      flex: 1;
      padding-right: 20px;
    }
    .product-name {
      font-size: 18px;
      font-weight: bold;
      color: #333;
      margin-bottom: 5px;
    }
    .product-bank {
      font-size: 14px;
      color: #666;
      margin-bottom: 15px;
    }
    .product-tags {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }
    .product-tag {
      display: inline-block;
      padding: 2px 8px;
      border: 1px solid #5cb85c;
      border-radius: 3px;
      color: #5cb85c;
      font-size: 12px;
      background: #fff;
    }
    .product-details {
      display: flex;
      gap: 30px;
      flex-wrap: wrap;
      font-size: 14px;
      color: #666;
    }
    .product-detail-item {
      display: flex;
      align-items: center;
    }
    .product-detail-label {
      color: #999;
      margin-right: 5px;
    }
    .product-detail-value {
      color: #333;
      font-weight: 500;
    }
    .product-action {
      min-width: 120px;
      text-align: right;
    }
    .btn-apply {
      background: #5cb85c;
      color: #fff;
      border: none;
      padding: 10px 30px;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.3s;
    }
    .btn-apply:hover {
      background: #4cae4c;
    }
    .smart-match-header {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
      padding: 15px;
      background: #e8f5e9;
      border-radius: 4px;
    }
    .smart-match-icon {
      width: 40px;
      height: 40px;
      background: #5cb85c;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 15px;
      color: #fff;
      font-size: 20px;
    }
    .smart-match-title {
      font-size: 18px;
      font-weight: bold;
      color: #333;
    }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #999;
    }
    .empty-state i {
      font-size: 48px;
      margin-bottom: 15px;
      color: #ddd;
    }
  </style>
</head>
<body class="gray-bg">
<div class="container-div">
  <div class="row">
    <div class="col-sm-12">
      <div class="ibox">
        <div class="ibox-title">
          <h5>智能匹配</h5>
        </div>
        <div class="ibox-content">
          <div class="smart-match-header">
            <div class="smart-match-icon">
              <i class="fa fa-leaf"></i>
            </div>
            <div class="smart-match-title">智能匹配</div>
          </div>
          <div class="product-list-container" id="productListContainer">
            <div class="empty-state">
              <i class="fa fa-spinner fa-spin"></i>
              <p>正在加载产品列表...</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<th:block th:include="include :: footer" />
<script th:inline="javascript">
  var productPrefix = ctx + "system/bank/product";

  $(function () {
    loadProducts();
  });

  function loadProducts() {
    $.ajax({
      url: productPrefix + "/available",
      type: "GET",
      success: function(result) {
        if (result.code == web_status.SUCCESS) {
          var products = result.data || [];
          renderProducts(products);
        } else {
          showEmptyState("加载产品列表失败：" + (result.msg || "未知错误"));
        }
      },
      error: function() {
        showEmptyState("加载产品列表失败，请稍后重试");
      }
    });
  }

  function renderProducts(products) {
    var container = $('#productListContainer');
    container.empty();

    if (!products || products.length === 0) {
      showEmptyState("暂无可用的贷款产品");
      return;
    }

    products.forEach(function(product) {
      var card = createProductCard(product);
      container.append(card);
    });
  }

  function createProductCard(product) {
    var productName = product.productName || '未命名产品';
    var bankName = product.bankName || '未知银行';
    var minAmount = product.minAmount || 0;
    var maxAmount = product.maxAmount || 0;
    var minTerm = product.minTermMonths || 0;
    var maxTerm = product.maxTermMonths || 0;
    var interestRate = product.interestRate ? product.interestRate + '%' : '面议';

    var cardHtml = '<div class="product-card">' +
            '<div class="product-info">' +
            '<div class="product-name">' + productName + '</div>' +
            '<div class="product-bank">' + bankName + '</div>' +
            '<div class="product-tags">' +
            '<span class="product-tag">材料简单</span>' +
            '<span class="product-tag">审核便捷</span>' +
            '<span class="product-tag">放款快</span>' +
            '</div>' +
            '<div class="product-details">' +
            '<div class="product-detail-item">' +
            '<span class="product-detail-label">最快放款</span>' +
            '<span class="product-detail-value">3个工作日</span>' +
            '</div>' +
            '<div class="product-detail-item">' +
            '<span class="product-detail-label">申请额度(元)</span>' +
            '<span class="product-detail-value">' + maxAmount.toLocaleString() + '</span>' +
            '</div>' +
            '<div class="product-detail-item">' +
            '<span class="product-detail-label">贷款期限(月)</span>' +
            '<span class="product-detail-value">' + maxTerm + '</span>' +
            '</div>' +
            '<div class="product-detail-item">' +
            '<span class="product-detail-label">参考利率</span>' +
            '<span class="product-detail-value">年利率' + interestRate + '</span>' +
            '</div>' +
            '</div>' +
            '</div>' +
            '<div class="product-action">' +
            '<button class="btn-apply" onclick="applyLoan(' + product.id + ')">我要贷款</button>' +
            '</div>' +
            '</div>';

    return $(cardHtml);
  }

  function applyLoan(productId) {
    // 跳转到申请页面，并传递产品ID
    window.location.href = ctx + "farmer/finance/apply?productId=" + productId;
  }

  function showEmptyState(message) {
    var container = $('#productListContainer');
    container.html(
            '<div class="empty-state">' +
            '<i class="fa fa-inbox"></i>' +
            '<p>' + message + '</p>' +
            '</div>'
    );
  }
</script>
</body>
</html>
