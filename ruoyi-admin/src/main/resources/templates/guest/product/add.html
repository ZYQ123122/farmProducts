<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>新增贷款产品</title>
    <th:block th:include="include :: header('新增贷款产品')" />
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight">
    <form class="form-horizontal m" id="form-product">
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">产品名称：</label>
            <div class="col-sm-8">
                <input type="text" class="form-control" name="productName" id="productName" required>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">产品代码：</label>
            <div class="col-sm-8">
                <input type="text" class="form-control" name="productCode" id="productCode">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">最小贷款金额（元）：</label>
            <div class="col-sm-8">
                <input type="number" class="form-control" name="minAmount" id="minAmount" min="0" step="0.01" required>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">最大贷款金额（元）：</label>
            <div class="col-sm-8">
                <input type="number" class="form-control" name="maxAmount" id="maxAmount" min="0" step="0.01" required>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">最短期限（月）：</label>
            <div class="col-sm-8">
                <input type="number" class="form-control" name="minTermMonths" id="minTermMonths" min="1" step="1" required>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">最长期限（月）：</label>
            <div class="col-sm-8">
                <input type="number" class="form-control" name="maxTermMonths" id="maxTermMonths" min="1" step="1" required>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">年利率（%）：</label>
            <div class="col-sm-8">
                <input type="number" class="form-control" name="interestRate" id="interestRate" min="0" step="0.01" placeholder="留空表示面议">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">产品描述：</label>
            <div class="col-sm-8">
                <textarea class="form-control" name="description" id="description" rows="4"></textarea>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">申请条件：</label>
            <div class="col-sm-8">
                <textarea class="form-control" name="requirements" id="requirements" rows="4"></textarea>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">状态：</label>
            <div class="col-sm-8">
                <select class="form-control" name="status" id="status">
                    <option value="1">上架</option>
                    <option value="0">下架</option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">排序：</label>
            <div class="col-sm-8">
                <input type="number" class="form-control" name="sortOrder" id="sortOrder" value="0" min="0">
            </div>
        </div>
        <div class="form-group">
            <div class="col-sm-offset-3 col-sm-8">
                <button type="button" class="btn btn-primary" onclick="submitHandler()">保存</button>
                <button type="button" class="btn btn-default" onclick="$.modal.close()">取消</button>
            </div>
        </div>
    </form>
</div>
<th:block th:include="include :: footer" />
<script th:inline="javascript">
    var prefix = ctx + "system/bank/product";

    function submitHandler(index, layero) {
        // 表单验证
        if (!$('#productName').val() || $.trim($('#productName').val()) === '') {
            $.modal.alertWarning("请输入产品名称");
            return false;
        }
        var minAmount = parseFloat($('#minAmount').val());
        if (isNaN(minAmount) || minAmount < 0) {
            $.modal.alertWarning("请输入正确的最小贷款金额");
            return false;
        }
        var maxAmount = parseFloat($('#maxAmount').val());
        if (isNaN(maxAmount) || maxAmount < 0) {
            $.modal.alertWarning("请输入正确的最大贷款金额");
            return false;
        }
        if (maxAmount < minAmount) {
            $.modal.alertWarning("最大贷款金额必须大于等于最小贷款金额");
            return false;
        }
        var minTerm = parseInt($('#minTermMonths').val());
        if (isNaN(minTerm) || minTerm < 1) {
            $.modal.alertWarning("请输入正确的最短期限（月）");
            return false;
        }
        var maxTerm = parseInt($('#maxTermMonths').val());
        if (isNaN(maxTerm) || maxTerm < 1) {
            $.modal.alertWarning("请输入正确的最长期限（月）");
            return false;
        }
        if (maxTerm < minTerm) {
            $.modal.alertWarning("最长期限必须大于等于最短期限");
            return false;
        }
        
        // 使用框架提供的标准保存方法
        $.operate.saveTab(prefix + "/add", $('#form-product').serialize());
        
        return false; // 阻止默认提交
    }
</script>
</body>
</html>
