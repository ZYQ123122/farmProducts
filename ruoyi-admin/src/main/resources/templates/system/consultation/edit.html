<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
	<th:block th:include="include :: header('修改专家咨询')" />
	<th:block th:include="include :: summernote-css" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-consultation-edit">
			<input id="id" name="id" type="hidden">
			<div class="form-group">	
				<label class="col-sm-2 control-label is-required">咨询标题：</label>
				<div class="col-sm-10">
					<input id="title" name="title" class="form-control" type="text" required maxlength="200" placeholder="请输入咨询标题">
				</div>
			</div>
			<div class="form-group">	
				<label class="col-sm-2 control-label is-required">咨询内容：</label>
				<div class="col-sm-10">
				    <input id="content" name="content" type="hidden">
				    <div class="summernote"></div>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-2 control-label">咨询状态：</label>
				<div class="col-sm-10">
					<select name="status" class="form-control m-b">
						<option value="pending">待回复</option>
						<option value="answered">已回复</option>
						<option value="closed">已关闭</option>
					</select>
				</div>
			</div>
		</form>
	</div>
    <th:block th:include="include :: footer" />
    <th:block th:include="include :: summernote-js" />
    <script type="text/javascript">
        var prefix = ctx + "system/consultation";

	    $('.summernote').summernote({
	    	placeholder: '请输入咨询内容',
			height : 300,
			lang : 'zh-CN',
			followingToolbar: false,
			dialogsInBody: true,
			callbacks: {
                onImageUpload: function (files) {
                    sendFile(files[0], this);
                }
            }
		});
	    
	    // 上传文件
	    function sendFile(file, obj) {
	        var data = new FormData();
	        data.append("file", file);
	        $.ajax({
	            type: "POST",
	            url: ctx + "common/upload",
	            data: data,
	            cache: false,
	            contentType: false,
	            processData: false,
	            dataType: 'json',
	            success: function(result) {
	                if (result.code == web_status.SUCCESS) {
	                	$(obj).summernote('editor.insertImage', result.url, result.fileName);
					} else {
						$.modal.alertError(result.msg);
					}
	            },
	            error: function(error) {
	                $.modal.alertWarning("图片上传失败。");
	            }
	        });
	    }
		
		$("#form-consultation-edit").validate({
			focusCleanup: true
		});
		
		function submitHandler() {
	        if ($.validate.form()) {
	        	var sHTML = $('.summernote').summernote('code');
				$("#content").val(sHTML);
				$.operate.save(prefix + "/edit", $('#form-consultation-edit').serialize());
	        }
	    }
	</script>
</body>
</html>
