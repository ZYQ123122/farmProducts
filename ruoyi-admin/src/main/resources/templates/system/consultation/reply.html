<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
	<th:block th:include="include :: header('回复专家咨询')" />
	<th:block th:include="include :: summernote-css" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-reply">
			<input id="id" name="id" type="hidden">
			<div class="form-group">	
				<label class="col-sm-2 control-label">咨询标题：</label>
				<div class="col-sm-10">
					<input id="title" name="title" class="form-control" type="text" readonly>
				</div>
			</div>
			<div class="form-group">	
				<label class="col-sm-2 control-label">咨询内容：</label>
				<div class="col-sm-10">
					<div id="content" class="form-control" style="min-height: 100px; background-color: #f5f5f5; padding: 10px;" readonly></div>
				</div>
			</div>
			<div class="form-group">	
				<label class="col-sm-2 control-label is-required">回复内容：</label>
				<div class="col-sm-10">
				    <input id="reply" name="reply" type="hidden">
				    <div class="summernote"></div>
				</div>
			</div>
		</form>
	</div>
    <th:block th:include="include :: footer" />
    <th:block th:include="include :: summernote-js" />
    <script type="text/javascript">
        var prefix = ctx + "system/consultation";
        var id = $.getUrlParam("id");

	    $('.summernote').summernote({
	    	placeholder: '请输入回复内容',
			height : 300,
			lang : 'zh-CN',
			followingToolbar: false,
			dialogsInBody: true,
			callbacks: {
                onImageUpload: function (files) {
                    sendFile(files[0], this);
                }
            }
		});
	    
	    // 上传文件
	    function sendFile(file, obj) {
	        var data = new FormData();
	        data.append("file", file);
	        $.ajax({
	            type: "POST",
	            url: ctx + "common/upload",
	            data: data,
	            cache: false,
	            contentType: false,
	            processData: false,
	            dataType: 'json',
	            success: function(result) {
	                if (result.code == web_status.SUCCESS) {
	                	$(obj).summernote('editor.insertImage', result.url, result.fileName);
					} else {
						$.modal.alertError(result.msg);
					}
	            },
	            error: function(error) {
	                $.modal.alertWarning("图片上传失败。");
	            }
	        });
	    }
		
		$("#form-reply").validate({
			focusCleanup: true
		});
		
		// 加载咨询信息
		$(function() {
			var consultationId = $.common.isEmpty("[[${consultation.id}]]") ? $.getUrlParam("id") : "[[${consultation.id}]]";
			if (consultationId) {
				$("#id").val(consultationId);
				var title = $.common.isEmpty("[[${consultation.title}]]") ? "" : "[[${consultation.title}]]";
				var content = $.common.isEmpty("[[${consultation.content}]]") ? "" : "[[${consultation.content}]]";
				$("#title").val(title);
				$("#content").html(content);
			} else {
				// 如果没有从Controller传递，则通过API获取
				if (id) {
					$.get(prefix + "/detail/" + id, function(result) {
						if (result.code == web_status.SUCCESS) {
							var data = result.data;
							$("#id").val(data.id);
							$("#title").val(data.title);
							$("#content").html(data.content || '');
						}
					});
				}
			}
		});
		
		function submitHandler() {
	        if ($.validate.form()) {
	        	var sHTML = $('.summernote').summernote('code');
	        	if (!sHTML || sHTML.trim() == '' || sHTML == '<p><br></p>') {
	        		$.modal.alertWarning("请输入回复内容");
	        		return;
	        	}
				$("#reply").val(sHTML);
				$.operate.save(prefix + "/reply", $('#form-reply').serialize());
	        }
	    }
	</script>
</body>
</html>
