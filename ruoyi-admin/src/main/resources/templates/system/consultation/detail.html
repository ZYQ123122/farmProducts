<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
	<th:block th:include="include :: header('专家咨询详情')" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-consultation-detail">
			<div class="form-group">	
				<label class="col-sm-2 control-label">咨询ID：</label>
				<div class="col-sm-10">
					<input id="id" name="id" class="form-control" type="text" readonly>
				</div>
			</div>
			<div class="form-group">	
				<label class="col-sm-2 control-label">咨询标题：</label>
				<div class="col-sm-10">
					<input id="title" name="title" class="form-control" type="text" readonly>
				</div>
			</div>
			<div class="form-group">	
				<label class="col-sm-2 control-label">咨询内容：</label>
				<div class="col-sm-10">
					<div id="content" class="form-control" style="min-height: 200px; background-color: #f5f5f5; padding: 10px;" readonly></div>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-2 control-label">咨询状态：</label>
				<div class="col-sm-10">
					<input id="status" name="status" class="form-control" type="text" readonly>
				</div>
			</div>
			<div class="form-group" id="reply-group" style="display: none;">
				<label class="col-sm-2 control-label">专家回复：</label>
				<div class="col-sm-10">
					<div id="reply" class="form-control" style="min-height: 150px; background-color: #f5f5f5; padding: 10px;" readonly></div>
				</div>
			</div>
			<div class="form-group" id="reply-time-group" style="display: none;">
				<label class="col-sm-2 control-label">回复时间：</label>
				<div class="col-sm-10">
					<input id="replyTime" name="replyTime" class="form-control" type="text" readonly>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-2 control-label">创建者：</label>
				<div class="col-sm-10">
					<input id="createBy" name="createBy" class="form-control" type="text" readonly>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-2 control-label">创建时间：</label>
				<div class="col-sm-10">
					<input id="createTime" name="createTime" class="form-control" type="text" readonly>
				</div>
			</div>
		</form>
	</div>
    <th:block th:include="include :: footer" />
    <script type="text/javascript">
        var prefix = ctx + "system/consultation";
        var id = $.common.isEmpty("[[${id}]]") ? $.getUrlParam("id") : "[[${id}]]";

        $(function() {
            getInfo();
        });

        function getInfo() {
            $.get(prefix + "/detail/" + id, function(result) {
                if (result.code == web_status.SUCCESS) {
                    var data = result.data;
                    $("#id").val(data.id);
                    $("#title").val(data.title);
                    $("#content").html(data.content || '');
                    var statusText = '';
                    if (data.status == 'pending') {
                        statusText = '待回复';
                    } else if (data.status == 'answered') {
                        statusText = '已回复';
                    } else if (data.status == 'closed') {
                        statusText = '已关闭';
                    }
                    $("#status").val(statusText);
                    $("#createBy").val(data.createBy);
                    $("#createTime").val(data.createTime);
                    
                    if (data.reply) {
                        $("#reply").html(data.reply);
                        $("#reply-group").show();
                        if (data.replyTime) {
                            $("#replyTime").val(data.replyTime);
                            $("#reply-time-group").show();
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
