<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:include="include :: header('审核专家申请')" />
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
  <form class="form-horizontal m" id="form-audit">
    <input type="hidden" id="id" name="id" th:value="${expertInfo.id}">
    <div class="form-group">
      <label class="col-sm-3 control-label">专家信息ID：</label>
      <div class="col-sm-8">
        <input id="expertId" name="expertId" class="form-control" type="text" th:value="${expertInfo.id}" readonly>
      </div>
    </div>
    <div class="form-group">
      <label class="col-sm-3 control-label">用户ID：</label>
      <div class="col-sm-8">
        <input id="userId" name="userId" class="form-control" type="text" th:value="${expertInfo.userId}" readonly>
      </div>
    </div>
    <div class="form-group">
      <label class="col-sm-3 control-label">专业领域：</label>
      <div class="col-sm-8">
        <input id="specialty" name="specialty" class="form-control" type="text" th:value="${expertInfo.specialty}" readonly>
      </div>
    </div>
    <div class="form-group">
      <label class="col-sm-3 control-label">工作经验：</label>
      <div class="col-sm-8">
        <textarea id="experience" name="experience" class="form-control" rows="3" readonly th:text="${expertInfo.experience}"></textarea>
      </div>
    </div>
    <div class="form-group">
      <label class="col-sm-3 control-label">专家简介：</label>
      <div class="col-sm-8">
        <textarea id="description" name="description" class="form-control" rows="4" readonly th:text="${expertInfo.description}"></textarea>
      </div>
    </div>
    <div class="form-group">
      <label class="col-sm-3 control-label">擅长方向：</label>
      <div class="col-sm-8">
        <input id="expertise" name="expertise" class="form-control" type="text" th:value="${expertInfo.expertise}" readonly>
      </div>
    </div>
    <div class="form-group">
      <label class="col-sm-3 control-label">主要成就：</label>
      <div class="col-sm-8">
        <textarea id="achievements" name="achievements" class="form-control" rows="3" readonly th:text="${expertInfo.achievements}"></textarea>
      </div>
    </div>
    <div class="form-group">
      <label class="col-sm-3 control-label">当前审核状态：</label>
      <div class="col-sm-8">
        <input id="currentAuditStatus" name="currentAuditStatus" class="form-control" type="text"
               th:value="${expertInfo.auditStatus == '0' ? '待审核' : (expertInfo.auditStatus == '1' ? '已通过' : '已拒绝')}" readonly>
      </div>
    </div>
    <div class="form-group">
      <label class="col-sm-3 control-label is-required">审核结果：</label>
      <div class="col-sm-8">
        <select class="form-control" id="auditStatus" name="auditStatus" required>
          <option value="">请选择</option>
          <option value="1">通过</option>
          <option value="2">拒绝</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label class="col-sm-3 control-label">审核备注：</label>
      <div class="col-sm-8">
        <textarea id="auditRemark" name="auditRemark" class="form-control" rows="3" placeholder="请输入审核备注（可选）"></textarea>
      </div>
    </div>
    <div class="form-group">
      <div class="col-sm-offset-3 col-sm-8">
        <button type="submit" class="btn btn-primary">提交审核</button>
        <button type="button" class="btn btn-default" onclick="$.modal.close()">取消</button>
      </div>
    </div>
  </form>
</div>
<th:block th:include="include :: footer" />
<script type="text/javascript">
  var prefix = ctx + "system/expert";

  $(function() {
    $("#form-audit").validate({
      rules: {
        auditStatus: {
          required: true
        }
      },
      submitHandler: function(form) {
        var id = $("#id").val();
        var auditStatus = $("#auditStatus").val();
        var auditRemark = $("#auditRemark").val();

        if (!auditStatus) {
          $.modal.alertWarning("请选择审核结果");
          return false;
        }

        $.operate.save(prefix + "/audit", $.param({
          id: id,
          auditStatus: auditStatus,
          auditRemark: auditRemark
        }));
      }
    });
  });
</script>
</body>
</html>
