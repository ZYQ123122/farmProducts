<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('用户智能匹配')" />
    <!-- 引入自定义样式 -->
    <link th:href="@{/css/system/userMatch.css}" rel="stylesheet" />
</head>
<body class="gray-bg">
<div class="wrapper wrapper-content animated fadeInRight">
    <div class="row">
        <div class="col-sm-12">
            <!-- 匹配条件表单卡片 -->
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5>匹配条件</h5>
                </div>
                <div class="ibox-content">
                    <form class="form-horizontal m-t" id="matchForm">
                        <!-- 目标用户类型 -->
                        <div class="form-group">
                            <label class="col-sm-3 control-label">匹配目标：</label>
                            <div class="col-sm-8">
                                <select class="form-control" id="targetUserType" name="targetUserType">
                                    <option value="">请选择匹配目标类型</option>
                                    <option value="02">农户</option>
                                    <option value="03">专家</option>
                                    <option value="04">银行</option>
                                    <option value="05">买家</option>
                                </select>
                            </div>
                        </div>
                        <!-- 所在地区 -->
                        <div class="form-group">
                            <label class="col-sm-3 control-label">所在地区：</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" id="area" name="area" placeholder="请输入地区（格式：省-市-区）">
                            </div>
                        </div>
                        <!-- 经营/采购品类 -->
                        <div class="form-group">
                            <label class="col-sm-3 control-label">经营/采购品类：</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" id="category" name="category" placeholder="如：水稻/生猪/蔬菜">
                            </div>
                        </div>
                        <!-- 需求类型 -->
                        <div class="form-group">
                            <label class="col-sm-3 control-label">需求类型：</label>
                            <div class="col-sm-8">
                                <select class="form-control" id="demandType" name="demandType">
                                    <option value="">请选择需求类型</option>
                                    <option value="融资">融资</option>
                                    <option value="技术">技术</option>
                                    <option value="采购">采购</option>
                                    <option value="供货">供货</option>
                                </select>
                            </div>
                        </div>
                        <!-- 规模 -->
                        <div class="form-group">
                            <label class="col-sm-3 control-label">规模：</label>
                            <div class="col-sm-8">
                                <input type="number" class="form-control" id="scale" name="scale" placeholder="农户：亩数/头数；买家：采购量；银行：授信额度">
                            </div>
                        </div>
                        <!-- 专家专属字段（默认隐藏） -->
                        <div class="form-group" id="expertFieldGroup" style="display: none;">
                            <label class="col-sm-3 control-label">擅长领域：</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" id="expertField" name="expertField" placeholder="如：水稻种植技术/生猪养殖">
                            </div>
                        </div>
                        <!-- 银行专属字段（默认隐藏） -->
                        <div class="form-group" id="bankLoanTypeGroup" style="display: none;">
                            <label class="col-sm-3 control-label">贷款类型：</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" id="bankLoanType" name="bankLoanType" placeholder="如：水稻种植贷/生猪养殖贷">
                            </div>
                        </div>
                        <!-- 按钮组 -->
                        <div class="form-group">
                            <div class="col-sm-8 col-sm-offset-3">
                                <button type="button" class="btn btn-primary" id="submitMatch">发起匹配</button>
                                <button type="reset" class="btn btn-default" id="resetForm">重置</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <!-- 匹配结果展示（默认隐藏） -->
            <div class="ibox float-e-margins" id="resultBox" style="display: none;">
                <div class="ibox-title">
                    <h5>匹配结果（按匹配度降序）</h5>
                </div>
                <div class="ibox-content">
                    <table class="table table-striped table-bordered table-hover" id="matchResultTable">
                        <thead>
                        <tr>
                            <th class="text-center">匹配用户名</th>
                            <th class="text-center">用户类型</th>
                            <th class="text-center">所在地区</th>
                            <th class="text-center">品类</th>
                            <th class="text-center">匹配度(分)</th>
                            <th class="text-center">规模</th>
                            <th class="text-center" id="expertFieldTh" style="display: none;">擅长领域</th>
                            <th class="text-center" id="bankLoanTypeTh" style="display: none;">贷款类型</th>
                        </tr>
                        </thead>
                        <tbody id="matchResultBody">
                        <!-- 结果由JS动态填充 -->
                        </tbody>
                    </table>
                    <!-- 无结果提示 -->
                    <div class="text-center" id="emptyResult" style="display: none; padding: 20px;">
                        <i class="fa fa-info-circle"></i> 暂无匹配结果
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 引入公共JS -->
<th:block th:include="include :: footer" />
<!-- 引入自定义JS -->
<script th:src="@{/js/system/userMatch.js}"></script>
</body>
</html>
